name: Publicar demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'viewer_demo.zip'
      - '.github/workflows/publish-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extraer la muestra estática
        run: |
          mkdir -p _site
          unzip -q viewer_demo.zip -d _site
          test -s _site/index.html
          test -s _site/data/catalog.js
          test -s _site/LICENCIA_DATOS.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
